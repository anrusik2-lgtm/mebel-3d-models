<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конфигуратор - ВиллаМебель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; overflow: hidden; background: #f0f0f0; }
        #sidebar { position: absolute; left: 0; top: 0; width: 320px; height: 100vh; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; z-index: 100; }
        #sidebar-header { padding: 20px; background: #0044cc; color: white; }
        #sidebar-header h1 { font-size: 20px; margin-bottom: 5px; }
        #sidebar-header p { font-size: 12px; opacity: 0.9; }
        #search-box { padding: 15px; border-bottom: 1px solid #ddd; }
        #search-input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; }
        #search-input:focus { outline: none; border-color: #0044cc; }
        #model-list { flex: 1; overflow-y: auto; padding: 10px; }
        .model-item { padding: 15px; margin-bottom: 10px; background: #f8f9fa; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s; }
        .model-item:hover { background: #e3f2fd; border-color: #0044cc; }
        .model-item.active { background: #0044cc; color: white; }
        .model-item h3 { font-size: 14px; margin-bottom: 5px; }
        .model-item .category { font-size: 11px; color: #666; display: inline-block; background: #ddd; padding: 2px 8px; border-radius: 4px; }
        .model-item.active .category { background: rgba(255,255,255,0.3); color: white; }
        #main-area { position: absolute; left: 320px; right: 300px; top: 0; bottom: 0; }
        #viewport { width: 100%; height: 100%; }
        #settings-panel { position: absolute; right: 0; top: 0; width: 300px; height: 100vh; background: white; box-shadow: -2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; z-index: 100; }
        .tabs { display: flex; border-bottom: 2px solid #ddd; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: bold; color: #666; }
        .tab.active { color: #0044cc; border-bottom: 3px solid #0044cc; }
        .tab-content { display: none; flex: 1; overflow-y: auto; padding: 15px; }
        .tab-content.active { display: block; }
        .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .color-btn { width: 100%; aspect-ratio: 1; border: 3px solid #fff; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .color-btn:hover { transform: scale(1.1); }
        .category-title { font-weight: bold; margin: 20px 0 10px 0; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .texture-item { display: flex; align-items: center; margin-bottom: 10px; padding: 8px; border: 1px solid #eee; border-radius: 6px; cursor: pointer; }
        .texture-item:hover { background: #f0f8ff; border-color: #0044cc; }
        .texture-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; margin-right: 12px; border: 1px solid #ccc; }
        .texture-name { font-size: 13px; font-weight: bold; }
        #reset-btn { margin: 15px; padding: 12px; background: #f5deb3; border: 2px solid #d4a76a; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        #info { position: absolute; bottom: 20px; left: 340px; background: rgba(0,0,0,0.8); color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; z-index: 50; max-width: 400px; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 30px; border-radius: 12px; z-index: 200; display: none; text-align: center; }
        #loading.show { display: block; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #0044cc; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <h1>🏭 ВиллаМебель</h1>
            <p>3D конфигуратор</p>
        </div>
        <div id="search-box">
            <input type="text" id="search-input" placeholder="🔍 Поиск модели...">
        </div>
        <div id="model-list">
            <div style="text-align: center; padding: 40px; color: #999;">
                <div class="spinner" style="width: 30px; height: 30px; border-width: 3px; margin: 0 auto 10px;"></div>
                Загрузка списка моделей...
            </div>
        </div>
    </div>
    <div id="main-area"><div id="viewport"></div></div>
    <div id="settings-panel">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('colors')">🎨 Цвета</div>
            <div class="tab" onclick="switchTab('textures')">🖼️ Текстуры</div>
        </div>
        <div id="colors" class="tab-content active">
            <div class="color-grid">
                <button class="color-btn" style="background:#cc0000" data-type="color" data-value="#cc0000"></button>
                <button class="color-btn" style="background:#00aa00" data-type="color" data-value="#00aa00"></button>
                <button class="color-btn" style="background:#0044cc" data-type="color" data-value="#0044cc"></button>
                <button class="color-btn" style="background:#eeeeee" data-type="color" data-value="#eeeeee"></button>
                <button class="color-btn" style="background:#111111" data-type="color" data-value="#111111"></button>
                <button class="color-btn" style="background:#ffcc00" data-type="color" data-value="#ffcc00"></button>
                <button class="color-btn" style="background:#8b4513" data-type="color" data-value="#8b4513"></button>
                <button class="color-btn" style="background:#f5deb3" data-type="color" data-value="#f5deb3"></button>
            </div>
        </div>
        <div id="textures" class="tab-content"><div id="texture-list"></div></div>
        <button id="reset-btn" data-type="reset">🔄 Вернуть материал</button>
    </div>
    <div id="info">Выберите модель</div>
    <div id="loading"><div class="spinner"></div><div id="loading-text">Загрузка...</div></div>

    <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const GITHUB_REPO = 'anrusik2-lgtm/mebel-3d-models';
        const MODELS_URL = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/models.json`;
        const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/`;

        const texturesData = [
            { category: 'fantasy', name: 'Лимонный сорбет', image: 'https://st.vilenamebel.ru/14/2993/177/limonnyy_sorbet_7123_ultradecor.jpg' },
            { category: 'fantasy', name: 'Песочный 0515', image: 'https://st.vilenamebel.ru/14/2993/180/pesochnyy_0515_ultradecor.jpg' },
            { category: 'standard', name: 'Бук Бавария', image: 'https://st.vilenamebel.ru/14/2993/195/buk_bavariya_svetlyy_nordeco_.jpg' },
            { category: 'standard', name: 'Дуб Сонома', image: 'https://st.vilenamebel.ru/14/2993/203/dub_sonoma_3025_ultradecor.jpg' }
        ];

        let scene, camera, renderer, controls, currentModel, selectedObject;
        let allMeshes = [], edgeObjects = new Set(), originalMaterials = new Map();
        let modelsData = [], EDGE_THRESHOLD = 0.005, NEIGHBOR_TOLERANCE = 0.00005;

        function initScene() {
            const viewport = document.getElementById('viewport');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0e0e0);
            camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.01, 100000);
            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            viewport.appendChild(renderer.domElement);
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
            scene.add(new THREE.GridHelper(100, 100, 0x888888, 0xcccccc));
            animate();
        }

        async function loadModelsList() {
            try {
                const response = await fetch(MODELS_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                modelsData = data.models || [];
                renderModelsList(modelsData);
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('model-list').innerHTML = `<div style="color:red;padding:20px;">Ошибка: ${error.message}</div>`;
            }
        }

        function renderModelsList(models) {
            const listEl = document.getElementById('model-list');
            listEl.innerHTML = '';
            if (models.length === 0) { listEl.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">Нет моделей</div>'; return; }
            models.forEach(model => {
                const div = document.createElement('div');
                div.className = 'model-item';
                div.innerHTML = `<h3>${model.name}</h3><span class="category">${model.category || ''}</span>`;
                div.onclick = (e) => { e.stopPropagation(); loadModel(model, div); };
                listEl.appendChild(div);
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            renderModelsList(modelsData.filter(m => m.name.toLowerCase().includes(q) || (m.tags && m.tags.some(t => t.toLowerCase().includes(q)))));
        });

        async function loadModel(model, element) {
            document.querySelectorAll('.model-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            showLoading(`Загрузка: ${model.name}`);
            const modelUrl = RAW_BASE + model.file;
            const loader = new GLTFLoader();
            loader.load(modelUrl, (gltf) => { processModel(gltf.scene, model.name); hideLoading(); },
                (xhr) => { if (xhr.total) showLoading(`${(xhr.loaded/xhr.total*100).toFixed(0)}%`); },
                (error) => { hideLoading(); alert(`Ошибка: ${error.message}`); });
        }

        function processModel(model, modelName) {
            if (currentModel) { scene.remove(currentModel); currentModel.traverse(c => { if(c.geometry) c.geometry.dispose(); }); }
            currentModel = model; scene.add(model);
            allMeshes = []; edgeObjects.clear(); originalMaterials.clear();
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            EDGE_THRESHOLD = maxDim > 100 ? 2.0 : 0.002;
            NEIGHBOR_TOLERANCE = maxDim > 100 ? 0.05 : 0.00005;
            let meshCount = 0;
            model.traverse((child) => {
                if (child.isMesh) {
                    meshCount++; allMeshes.push(child);
                    originalMaterials.set(child.uuid, child.material.clone());
                    const childSize = new THREE.Box3().setFromObject(child).getSize(new THREE.Vector3());
                    if (Math.min(childSize.x, childSize.y, childSize.z) < EDGE_THRESHOLD && Math.min(childSize.x, childSize.y, childSize.z) > 0) edgeObjects.add(child);
                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                    mats.forEach(mat => { mat.side = THREE.DoubleSide; mat.transparent = false; mat.polygonOffset = true; mat.polygonOffsetFactor = 1.0; });
                }
            });
            const center = box.getCenter(new THREE.Vector3());
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = (maxDim / 2) / Math.tan(fov / 2) * 1.8;
            camera.position.set(center.x, center.y + size.y * 0.2, center.z - cameraZ);
            camera.lookAt(center); controls.target.copy(center); controls.update();
            document.getElementById('info').innerText = `✅ ${modelName}\nДеталей: ${meshCount}`;
        }

        function findAdjacentEdges(object) {
            const objectBox = new THREE.Box3().setFromObject(object);
            objectBox.expandByScalar(NEIGHBOR_TOLERANCE);
            const adjacent = [];
            edgeObjects.forEach(edge => { if (edge !== object && objectBox.intersectsBox(new THREE.Box3().setFromObject(edge))) adjacent.push(edge); });
            return adjacent;
        }

        const textureLoader = new THREE.TextureLoader();
        textureLoader.crossOrigin = 'anonymous';

        function applyMaterial(type, value) {
            if (!selectedObject) { alert('Кликните по детали'); return; }
            const group = [selectedObject, ...findAdjacentEdges(selectedObject)];
            if (type === 'reset') { group.forEach(obj => { const orig = originalMaterials.get(obj.uuid); if (orig) { obj.material = orig.clone(); obj.material.needsUpdate = true; } }); return; }
            if (type === 'color') { const color = new THREE.Color(value); group.forEach(obj => { const mats = Array.isArray(obj.material) ? obj.material : [obj.material]; mats.forEach(m => { m.color.set(color); m.map = null; m.needsUpdate = true; }); }); }
            else if (type === 'texture') { textureLoader.load(value, (tex) => { tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = tex.wrapT = THREE.RepeatWrapping; group.forEach(obj => { const mats = Array.isArray(obj.material) ? obj.material : [obj.material]; mats.forEach(m => { m.map = tex; m.color.setHex(0xffffff); m.needsUpdate = true; }); }); }); }
        }

        const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
        renderer.domElement.addEventListener('click', (event) => {
            if (!currentModel) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(allMeshes, true);
            if (intersects.length > 0) {
                selectedObject = intersects[0].object;
                allMeshes.forEach(m => { const mats = Array.isArray(m.material) ? m.material : [m.material]; mats.forEach(mt => mt.emissive = new THREE.Color(0x000000)); });
                const selMats = Array.isArray(selectedObject.material) ? selectedObject.material : [selectedObject.material];
                selMats.forEach(m => m.emissive = new THREE.Color(0x444444));
                const adj = findAdjacentEdges(selectedObject);
                document.getElementById('info').innerText += `\n👉 ${selectedObject.name || 'Деталь'}\nКромки: ${adj.length}`;
            }
        });

        document.querySelectorAll('.color-btn, #reset-btn').forEach(btn => btn.addEventListener('click', () => applyMaterial(btn.dataset.type, btn.dataset.value)));

        const textureListEl = document.getElementById('texture-list');
        const categories = { 'fantasy': '🎨 Фантазийные', 'standard': '🪵 Стандартные' };
        for (const [catKey, catTitle] of Object.entries(categories)) {
            const header = document.createElement('div'); header.className = 'category-title'; header.innerText = catTitle; textureListEl.appendChild(header);
            texturesData.filter(t => t.category === catKey).forEach(tex => {
                const div = document.createElement('div'); div.className = 'texture-item';
                div.innerHTML = `<img src="${tex.image}" loading="lazy"><div class="texture-name">${tex.name}</div>`;
                div.addEventListener('click', () => applyMaterial('texture', tex.image));
                textureListEl.appendChild(div);
            });
        }

        function showLoading(text) { document.getElementById('loading-text').innerText = text; document.getElementById('loading').classList.add('show'); }
        function hideLoading() { document.getElementById('loading').classList.remove('show'); }
        
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }
        
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        window.addEventListener('resize', () => { const v = document.getElementById('viewport'); camera.aspect = v.clientWidth / v.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(v.clientWidth, v.clientHeight); });

        initScene();
        loadModelsList();
    </script>
</body>
</html>
