<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конфигуратор мебели</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; overflow: hidden; background: #f0f0f0; }
        
        /* Левая панель со списком моделей */
        #sidebar {
            position: absolute; left: 0; top: 0; width: 320px; height: 100vh;
            background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; z-index: 100;
        }
        #sidebar-header {
            padding: 20px; background: #0044cc; color: white;
        }
        #sidebar-header h1 { font-size: 20px; margin-bottom: 5px; }
        #sidebar-header p { font-size: 12px; opacity: 0.9; }
        
        /* Поиск */
        #search-box {
            padding: 15px; border-bottom: 1px solid #ddd;
        }
        #search-input {
            width: 100%; padding: 12px; border: 2px solid #ddd;
            border-radius: 8px; font-size: 14px;
        }
        #search-input:focus { outline: none; border-color: #0044cc; }
        
        /* Список моделей */
        #model-list {
            flex: 1; overflow-y: auto; padding: 10px;
        }
        .model-item {
            padding: 15px; margin-bottom: 10px; background: #f8f9fa;
            border-radius: 8px; cursor: pointer; border: 2px solid transparent;
            transition: all 0.3s;
        }
        .model-item:hover { background: #e3f2fd; border-color: #0044cc; }
        .model-item.active { background: #0044cc; color: white; }
        .model-item h3 { font-size: 14px; margin-bottom: 5px; }
        .model-item .category {
            font-size: 11px; color: #666; display: inline-block;
            background: #ddd; padding: 2px 8px; border-radius: 4px;
        }
        .model-item.active .category { background: rgba(255,255,255,0.3); color: white; }
        
        /* Правая панель с 3D и настройками */
        #main-area {
            position: absolute; left: 320px; right: 300px; top: 0; bottom: 0;
        }
        #viewport { width: 100%; height: 100%; }
        
        /* Панель настроек справа */
        #settings-panel {
            position: absolute; right: 0; top: 0; width: 300px; height: 100vh;
            background: white; box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; z-index: 100;
        }
        .tabs { display: flex; border-bottom: 2px solid #ddd; }
        .tab {
            flex: 1; padding: 15px; text-align: center; cursor: pointer;
            font-weight: bold; color: #666; transition: all 0.3s;
        }
        .tab:hover { background: #f5f5f5; }
        .tab.active { color: #0044cc; border-bottom: 3px solid #0044cc; }
        .tab-content { display: none; flex: 1; overflow-y: auto; padding: 15px; }
        .tab-content.active { display: block; }
        
        /* Цвета */
        .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .color-btn {
            width: 100%; aspect-ratio: 1; border: 3px solid #fff;
            border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .color-btn:hover { transform: scale(1.1); }
        
        /* Текстуры */
        .category-title {
            font-weight: bold; margin: 20px 0 10px 0; color: #333;
            border-bottom: 2px solid #ddd; padding-bottom: 5px;
        }
        .texture-item {
            display: flex; align-items: center; margin-bottom: 10px; padding: 8px;
            border: 1px solid #eee; border-radius: 6px; cursor: pointer;
            transition: all 0.2s;
        }
        .texture-item:hover { background: #f0f8ff; border-color: #0044cc; }
        .texture-item img {
            width: 60px; height: 60px; object-fit: cover;
            border-radius: 4px; margin-right: 12px; border: 1px solid #ccc;
        }
        .texture-name { font-size: 13px; font-weight: bold; color: #333; }
        
        #reset-btn {
            margin: 15px; padding: 12px; background: #f5deb3;
            border: 2px solid #d4a76a; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 14px;
        }
        #reset-btn:hover { background: #e6c995; }
        
        /* Инфо панель */
        #info {
            position: absolute; bottom: 20px; left: 340px;
            background: rgba(0,0,0,0.8); color: #00ff00;
            padding: 15px; border-radius: 8px; font-family: monospace;
            font-size: 13px; z-index: 50; max-width: 400px;
        }
        
        /* Загрузка */
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); color: white;
            padding: 30px; border-radius: 12px; z-index: 200;
            display: none; text-align: center;
        }
        #loading.show { display: block; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #f3f3f3;
            border-top: 5px solid #0044cc; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Левая панель -->
    <div id="sidebar">
        <div id="sidebar-header">
            <h1>🏭 3D конфигуратор мебели</h1>
        </div>
        <div id="search-box">
            <input type="text" id="search-input" placeholder="🔍 Поиск модели...">
        </div>
        <div id="model-list">
            <div style="text-align: center; padding: 40px; color: #999;">
                <div class="spinner" style="width: 30px; height: 30px; border-width: 3px; margin: 0 auto 10px;"></div>
                Загрузка списка моделей...
            </div>
        </div>
    </div>
    
    <!-- 3D Viewport -->
    <div id="main-area">
        <div id="viewport"></div>
    </div>
    
    <!-- Правая панель -->
    <div id="settings-panel">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('colors')">🎨 Цвета</div>
            <div class="tab" onclick="switchTab('textures')">🖼️ Текстуры</div>
        </div>
        
        <div id="colors" class="tab-content active">
            <div class="color-grid">
                <button class="color-btn" style="background:#cc0000" data-type="color" data-value="#cc0000" title="Красный"></button>
                <button class="color-btn" style="background:#00aa00" data-type="color" data-value="#00aa00" title="Зелёный"></button>
                <button class="color-btn" style="background:#0044cc" data-type="color" data-value="#0044cc" title="Синий"></button>
                <button class="color-btn" style="background:#eeeeee" data-type="color" data-value="#eeeeee" title="Белый"></button>
                <button class="color-btn" style="background:#111111" data-type="color" data-value="#111111" title="Чёрный"></button>
                <button class="color-btn" style="background:#ffcc00" data-type="color" data-value="#ffcc00" title="Жёлтый"></button>
                <button class="color-btn" style="background:#8b4513" data-type="color" data-value="#8b4513" title="Коричневый"></button>
                <button class="color-btn" style="background:#f5deb3" data-type="color" data-value="#f5deb3" title="Бежевый"></button>
            </div>
        </div>
        
        <div id="textures" class="tab-content">
            <div id="texture-list"></div>
        </div>
        
        <button id="reset-btn" data-type="reset">🔄 Вернуть исходный материал</button>
    </div>
    
    <!-- Инфо -->
    <div id="info">Выберите модель из списка слева</div>
    
    <!-- Загрузка -->
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Загрузка модели...</div>
    </div>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // === КОНФИГУРАЦИЯ ===
        const GITHUB_REPO = 'anrusik2-lgtm/mebel-3d-models'; // ЗАМЕНИТЕ на ваш репозиторий
        const MODELS_URL = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/models.json`;
        const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/`;

        // === ДАННЫЕ ТЕКСТУР ===
        const texturesData = [
            { category: 'fantasy', name: 'Лимонный сорбет 7123', image: 'https://st.vilenamebel.ru/14/2993/177/limonnyy_sorbet_7123_ultradecor.jpg' },
            { category: 'fantasy', name: 'Песочный 0515', image: 'https://st.vilenamebel.ru/14/2993/180/pesochnyy_0515_ultradecor.jpg' },
            { category: 'standard', name: 'Бук Бавария светлый', image: 'https://st.vilenamebel.ru/14/2993/195/buk_bavariya_svetlyy_nordeco_.jpg' },
            { category: 'standard', name: 'Дуб Сонома 3025', image: 'https://st.vilenamebel.ru/14/2993/203/dub_sonoma_3025_ultradecor.jpg' },
            { category: 'standard', name: 'Венге Цаво 3354', image: 'https://st.vilenamebel.ru/14/2993/210/venge_tsavo_3354_ultradecor.jpg' }
        ];

        // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
        let scene, camera, renderer, controls;
        let currentModel = null;
        let selectedObject = null;
        let allMeshes = [];
        let edgeObjects = new Set();
        let originalMaterials = new Map();
        let modelsData = [];
        let EDGE_THRESHOLD = 0.005;
        let NEIGHBOR_TOLERANCE = 0.00005;

        // === ИНИЦИАЛИЗАЦИЯ СЦЕНЫ ===
        function initScene() {
            const viewport = document.getElementById('viewport');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0e0e0);
            
            camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.01, 100000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            viewport.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Освещение
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);
            const frontLight = new THREE.DirectionalLight(0xffffff, 0.8);
            frontLight.position.set(0, 0, 100);
            scene.add(frontLight);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
            scene.add(new THREE.GridHelper(100, 100, 0x888888, 0xcccccc));

            animate();
        }

        // === ЗАГРУЗКА СПИСКА МОДЕЛЕЙ ===
        async function loadModelsList() {
            try {
                const response = await fetch(MODELS_URL);
                if (!response.ok) throw new Error('Не удалось загрузить models.json');
                const data = await response.json();
                modelsData = data.models || [];
                renderModelsList(modelsData);
            } catch (error) {
                console.error('Ошибка загрузки списка:', error);
                document.getElementById('model-list').innerHTML = 
                    `<div style="color: red; padding: 20px;">
                        Ошибка загрузки списка моделей<br>
                        <small>${error.message}</small>
                    </div>`;
            }
        }

        // === ОТРИСОВКА СПИСКА МОДЕЛЕЙ ===
        function renderModelsList(models) {
            const listEl = document.getElementById('model-list');
            listEl.innerHTML = '';
            
            if (models.length === 0) {
                listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">Модели не найдены</div>';
                return;
            }
            
            models.forEach(model => {
                const div = document.createElement('div');
                div.className = 'model-item';
                div.innerHTML = `
                    <h3>${model.name}</h3>
                    <span class="category">${model.category || 'без категории'}</span>
                `;
                div.onclick = () => loadModel(model);
                listEl.appendChild(div);
            });
        }

        // === ПОИСК ===
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = modelsData.filter(m => 
                m.name.toLowerCase().includes(query) ||
                (m.tags && m.tags.some(t => t.toLowerCase().includes(query))) ||
                (m.category && m.category.toLowerCase().includes(query))
            );
            renderModelsList(filtered);
        });

        // === ЗАГРУЗКА МОДЕЛИ ===
        async function loadModel(model) {
            showLoading(`Загрузка: ${model.name}`);
            
            // Подсветка активной модели
            document.querySelectorAll('.model-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.model-item').classList.add('active');
            
            const modelUrl = RAW_BASE + model.file;
            
            try {
                const loader = new GLTFLoader();
                loader.load(modelUrl, 
                    (gltf) => {
                        processModel(gltf.scene, model.name);
                        hideLoading();
                        document.getElementById('info').innerText = `✅ Загружено: ${model.name}`;
                    },
                    (xhr) => {
                        const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                        showLoading(`Загрузка: ${percent}%`);
                    },
                    (error) => {
                        console.error('Ошибка загрузки модели:', error);
                        hideLoading();
                        alert(`Не удалось загрузить модель ${model.name}\n\nОшибка: ${error.message}`);
                    }
                );
            } catch (error) {
                hideLoading();
                alert('Ошибка: ' + error.message);
            }
        }

        // === ОБРАБОТКА МОДЕЛИ ===
        function processModel(model, modelName) {
            // Очистка старой модели
            if (currentModel) {
                scene.remove(currentModel);
                currentModel.traverse(c => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) {
                        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                        else c.material.dispose();
                    }
                });
            }
            
            currentModel = model;
            scene.add(model);
            
            allMeshes = [];
            edgeObjects.clear();
            originalMaterials.clear();
            
            // Определяем масштаб
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            
            if (maxDim > 100) {
                EDGE_THRESHOLD = 2.0;
                NEIGHBOR_TOLERANCE = 0.05;
            } else {
                EDGE_THRESHOLD = 0.002;
                NEIGHBOR_TOLERANCE = 0.00005;
            }
            
            // Проходим по всем мешам
            let meshCount = 0;
            model.traverse((child) => {
                if (child.isMesh) {
                    meshCount++;
                    allMeshes.push(child);
                    originalMaterials.set(child.uuid, child.material.clone());
                    
                    const childBox = new THREE.Box3().setFromObject(child);
                    const childSize = childBox.getSize(new THREE.Vector3());
                    const minDim = Math.min(childSize.x, childSize.y, childSize.z);
                    
                    if (minDim < EDGE_THRESHOLD && minDim > 0) {
                        edgeObjects.add(child);
                    }
                    
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    materials.forEach(mat => {
                        mat.side = THREE.DoubleSide;
                        mat.transparent = false;
                        mat.polygonOffset = true;
                        mat.polygonOffsetFactor = 1.0;
                        mat.polygonOffsetUnits = 1.0;
                    });
                }
            });
            
            // Настройка камеры
            const center = box.getCenter(new THREE.Vector3());
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = (maxDim / 2) / Math.tan(fov / 2) * 1.8;
            
            camera.position.set(center.x, center.y + (size.y * 0.2), center.z - cameraZ);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
            
            document.getElementById('info').innerText = 
                `✅ ${modelName}\n` +
                `Деталей: ${meshCount}\n` +
                `Кромки: ${edgeObjects.size}\n` +
                `Размер: ${size.x.toFixed(1)}x${size.y.toFixed(1)}x${size.z.toFixed(1)}`;
        }

        // === ПОИСК КРОМОК ===
        function findAdjacentEdges(object) {
            const objectBox = new THREE.Box3().setFromObject(object);
            objectBox.expandByScalar(NEIGHBOR_TOLERANCE);
            const adjacent = [];
            edgeObjects.forEach(edge => {
                if (edge === object) return;
                const edgeBox = new THREE.Box3().setFromObject(edge);
                if (objectBox.intersectsBox(edgeBox)) {
                    adjacent.push(edge);
                }
            });
            return adjacent;
        }

        // === ПРИМЕНЕНИЕ МАТЕРИАЛА ===
        const textureLoader = new THREE.TextureLoader();
        textureLoader.crossOrigin = 'anonymous';

        function applyMaterial(type, value) {
            if (!selectedObject) {
                alert('Сначала кликните по детали в 3D окне');
                return;
            }
            
            const groupToProcess = [selectedObject, ...findAdjacentEdges(selectedObject)];
            
            if (type === 'reset') {
                groupToProcess.forEach(obj => {
                    const origMat = originalMaterials.get(obj.uuid);
                    if (origMat) {
                        obj.material = origMat.clone();
                        obj.material.needsUpdate = true;
                    }
                });
                return;
            }
            
            if (type === 'color') {
                const color = new THREE.Color(value);
                groupToProcess.forEach(obj => {
                    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                    mats.forEach(mat => {
                        mat.color.set(color);
                        mat.map = null;
                        mat.needsUpdate = true;
                    });
                });
            } else if (type === 'texture') {
                textureLoader.load(value, (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.wrapS = THREE.RepeatWrapping;
                    texture.wrapT = THREE.RepeatWrapping;
                    
                    groupToProcess.forEach(obj => {
                        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                        mats.forEach(mat => {
                            mat.map = texture;
                            mat.color.setHex(0xffffff);
                            mat.needsUpdate = true;
                        });
                    });
                }, undefined, (err) => {
                    console.error('Ошибка текстуры:', err);
                    alert('Не удалось загрузить текстуру');
                });
            }
        }

        // === КЛИК ПО МОДЕЛИ ===
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        renderer.domElement.addEventListener('click', (event) => {
            if (!currentModel) return;
            
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(allMeshes, true);
            
            if (intersects.length > 0) {
                selectedObject = intersects[0].object;
                
                // Сброс подсветки
                allMeshes.forEach(m => {
                    const mats = Array.isArray(m.material) ? m.material : [m.material];
                    mats.forEach(mt => mt.emissive = new THREE.Color(0x000000));
                });
                
                // Подсветка выбранного
                const selMats = Array.isArray(selectedObject.material) ? selectedObject.material : [selectedObject.material];
                selMats.forEach(m => m.emissive = new THREE.Color(0x444444));
                
                const adjacent = findAdjacentEdges(selectedObject);
                const isEdge = edgeObjects.has(selectedObject);
                
                document.getElementById('info').innerText += 
                    `\n\n👉 ${selectedObject.name || 'Деталь'}\n` +
                    `${isEdge ? 'КРОМКА' : 'ДЕТАЛЬ'}\n` +
                    `Обработано: ${1 + adjacent.length} эл.`;
            }
        });

        // === ОБРАБОТЧИКИ КНОПОК ===
        document.querySelectorAll('.color-btn, #reset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                applyMaterial(btn.dataset.type, btn.dataset.value);
            });
        });

        // Генерация списка текстур
        const textureListEl = document.getElementById('texture-list');
        const categories = { 'fantasy': '🎨 Фантазийные', 'standard': '🪵 Стандартные' };
        
        for (const [catKey, catTitle] of Object.entries(categories)) {
            const header = document.createElement('div');
            header.className = 'category-title';
            header.innerText = catTitle;
            textureListEl.appendChild(header);
            
            texturesData.filter(t => t.category === catKey).forEach(tex => {
                const div = document.createElement('div');
                div.className = 'texture-item';
                div.dataset.type = 'texture';
                div.dataset.value = tex.image;
                div.innerHTML = `
                    <img src="${tex.image}" alt="${tex.name}" loading="lazy">
                    <div class="texture-name">${tex.name}</div>
                `;
                div.addEventListener('click', () => applyMaterial('texture', tex.image));
                textureListEl.appendChild(div);
            });
        }

        // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===
        function showLoading(text) {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading').classList.add('show');
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }
        
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            const viewport = document.getElementById('viewport');
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        });

        // === ЗАПУСК ===
        initScene();
        loadModelsList();
    </script>
</body>
</html>
